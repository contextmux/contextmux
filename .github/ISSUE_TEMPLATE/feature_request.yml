name: Feature request
description: Something it should do that it does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >-
        The situation, not the solution. What you were doing when you wanted this, and what you
        did instead. A proposal is much easier to judge against the problem that prompted it.
      placeholder: |
        Our tickets carry the affected component as a Jira field rather than in the description,
        so every run gets scoped to the whole repository and the path-scope gate never says
        anything useful.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already have a shape in mind, describe it.

  - type: textarea
    id: workaround
    attributes:
      label: What you are doing today
      description: >-
        Optional, and genuinely useful — a workaround that mostly works tells us how much this
        actually hurts.
